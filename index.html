<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>烬途 · Ember Path</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css?v=1.5.2">
<link rel="stylesheet" href="css/screens.css?v=1.5.2">
<link rel="stylesheet" href="css/battle.css?v=1.5.2">
</head>
<body>
<canvas id="fx"></canvas>
<div id="portrait-lock">
  <div class="pl-phone"><i></i></div>
  <p>请横置设备，继续旅途</p>
</div>
<!-- 加载 -->
<section id="screen-loading" class="screen active">
  <div class="load-wrap">
    <div class="load-mark"></div>
    <h1 class="load-title">烬 途</h1>
    <div class="load-sub">E M B E R&nbsp;&nbsp;P A T H</div>
    <div class="load-bar" id="loadBar"><i></i></div>
    <div class="load-tip" id="loadTip">点燃第一簇火…</div>
  </div>
</section>
<!-- 主菜单 -->
<section id="screen-menu" class="screen">
  <div class="menu-hills">
    <svg viewBox="0 0 1000 320" preserveAspectRatio="xMidYMax slice">
      <path d="M0 320 L0 205 L150 115 L270 200 L410 85 L570 230 L710 145 L850 240 L1000 165 L1000 320 Z" fill="#151009"/>
      <path d="M0 320 L0 262 L190 192 L340 262 L480 170 L650 272 L800 212 L1000 282 L1000 320 Z" fill="#0f0b07"/>
    </svg>
    <div class="menu-horizon"></div>
  </div>
  <div class="menu-core">
    <div class="menu-mark" data-mark="84"></div>
    <h1 class="menu-title"><span>烬</span><span>途</span></h1>
    <div class="menu-sub">E M B E R&nbsp;&nbsp;P A T H</div>
    <div class="menu-tag">死地求生 · 向烬而行</div>
    <div class="menu-btns">
      <button class="btn primary big" id="btnStart">启 程</button>
      <button class="btn primary big hidden" id="btnCont">继续旅途</button>
      <div class="row">
        <button class="btn ghost" id="btnSaves">存档馆</button>
        <button class="btn ghost" id="btnSetting">设 置</button>
        <button class="btn ghost" id="btnCodex">图 鉴</button>
      </div>
    </div>
    <div class="menu-ver">v1.5 · 原型</div>
  </div>
</section>
<!-- 地图 -->
<section id="screen-map" class="screen">
  <header class="map-head">
    <div class="mh-l"><span id="mhZone">烬径</span></div>
    <div class="mh-c" id="mhFloor">第 1 层</div>
    <div class="mh-r">
      <span class="mh-stat"><i data-ic="heart"></i><b id="mhHp">0</b></span>
      <span class="mh-stat"><i data-ic="coin"></i><b id="mhGold">0</b></span>
      <button class="icon-btn" id="mapSave" title="存档馆"><i data-ic="save"></i></button>
      <button class="icon-btn" id="mapBook" title="牌组"><i data-ic="book"></i></button>
      <button class="icon-btn" id="mapGear" title="设置"><i data-ic="gear"></i></button>
    </div>
  </header>
  <div class="map-body"><svg id="mapSvg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
</section>
<!-- 战斗 -->
<section id="screen-battle" class="screen">
  <div class="battle-top">
    <div class="bt-floor" id="btFloor">烬径</div>
    <button class="icon-btn" id="battleGear"><i data-ic="gear"></i></button>
  </div>
  <div class="battle-field" id="battleField">
    <div class="ground"></div>
    <div class="unit ally" id="allyUnit"></div>
    <div class="unit enemy" id="enemyUnit"></div>
    <div class="target-tip" id="targetTip"></div>
  </div>
  <div class="battle-bottom">
    <button class="pile" id="pileDraw"><i data-ic="cards"></i><b id="nDraw">0</b><span>抽牌堆</span></button>
    <div class="hand" id="hand"></div>
    <button class="pile" id="pileDiscard"><i data-ic="cards"></i><b id="nDisc">0</b><span>弃牌堆</span></button>
    <div class="e-orb" id="eOrb"><i data-ic="flame"></i><div class="e-num"><b id="eCur">3</b><span id="eMax">/3</span></div></div>
    <button class="btn endturn" id="endTurnBtn"><i data-ic="chevrons"></i><span>结束回合</span></button>
  </div>
</section>
<!-- 事件 / 奖励 / 篝火 / 选卡 / 存档馆 / 结算 -->
<section id="screen-event" class="screen"></section>
<section id="screen-reward" class="screen"></section>
<section id="screen-camp" class="screen"></section>
<section id="screen-select" class="screen"></section>
<section id="screen-saves" class="screen"></section>
<section id="screen-over" class="screen"></section>
<div id="vault" class="modal"></div>
<div id="pause" class="modal"></div>
<div id="toast"></div>
<div id="banner"><i class="b-line"></i><span class="b-txt"></span></div>
<div id="wipe"><i class="w-l"></i><i class="w-r"></i><i class="w-line"></i></div>
<script src="js/icon.js?v=1.5.2"></script>
<script src="js/data.js?v=1.5.2"></script>
<script src="js/ui.js?v=1.5.2"></script>
<script src="js/audio.js?v=1.5.2"></script>
<script src="js/save.js?v=1.5.2"></script>
<script src="js/map.js?v=1.5.2"></script>
<script src="js/battle.js?v=1.5.2"></script>
<script src="js/screens.js?v=1.5.2"></script>
<script src="js/story.js?v=1.5.2"></script>
<script src="js/game.js?v=1.5.2"></script>
</body>
</html>
